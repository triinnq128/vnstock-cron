name: Auto Run Python to Google Sheets

on:
  schedule:
    # 9h15, 10h15, 11h15, 13h15 giờ VN (UTC +7)
    - cron: "15 2,3,4,6 * * *"
  workflow_dispatch:

jobs:
  run-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth vnstock  # Thêm các thư viện bạn cần ở đây
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run main script
        env:
          # Đảm bảo bạn đã đặt Secret tên là GOOGLE_CREDENTIALS trong GitHub Settings
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_CREDENTIALS }}
          API_KEY_STOCK: ${{ secrets.API_KEY_STOCK }}
        run: |
          python main.py
