name: Auto Run Python

on:
  schedule:
    # 9h15, 10h15, 11h15, 13h15 giờ VN
    - cron: "15 2,3,4,6 * * *"
  workflow_dispatch:

jobs:
  run-job:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code từ repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3. Tạo venv + install
      - name: Setup venv
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run script
      - name: Run script
        run: |
          source venv/bin/activate
          python main.py
