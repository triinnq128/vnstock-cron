
name: Run Python Job

on:
  schedule:
    - cron: "15 2 * * *"   # chạy mỗi ngày (UTC)
  workflow_dispatch:       # cho phép bấm chạy tay

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Create venv
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run script
        run: |
          source venv/bin/activate
          python main.py
